name: TrustTunnel NAVQS Android APK

on:
  push:
    branches: [android/control-apk, android/dark-theme, android/quick-settings, android/app-vpn, fix/app-vpn-atomic-write]
    paths-ignore:
      - .github/scripts/boot-theme-emulator.sh
      - .github/scripts/android-theme-smoke.py
      - .github/scripts/android-tile-smoke.py
      - .github/workflows/android-theme-emulator.yml
  workflow_dispatch:
    inputs:
      check_update:
        description: Build the preceding version as well for an Android update test
        type: boolean
        default: true

permissions: {}

jobs:
  build:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Flutter 3.47.8 and Java 17
        run: |
          set -euo pipefail
          git clone --quiet --depth=1 --branch 3.47.8 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 737ba8f885dc774b53b442759999a312c9461e4e
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Prepare Android tools and generate sources
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
          flutter config --no-analytics
          flutter precache --android
          make init

      - name: Build the pinned App VPN Android adapter
        if: github.ref == 'refs/heads/android/app-vpn' || github.ref == 'refs/heads/fix/app-vpn-atomic-write'
        env:
          GPR_KEY: ${{ github.token }}
          RUN_APP_VPN_TESTS: ${{ github.ref == 'refs/heads/fix/app-vpn-atomic-write' }}
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35"
          make prepare-android-app-vpn

      - name: Check Android theme behavior, contrast and VPN scope
        if: (github.ref == 'refs/heads/android/dark-theme' || github.ref == 'refs/heads/android/quick-settings')
        run: |
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
          flutter test --no-pub --reporter expanded test/android_theme_test.dart test/android_theme_widget_test.dart

      - name: Verify Quick Settings profile selection and current configuration
        if: github.ref == 'refs/heads/android/quick-settings'
        run: flutter test --no-pub --reporter expanded test/android_tile_profile_test.dart

      - name: Build the TrustTunnel NAVQS ARM64 APKs without access to the signing key
        env:
          GPR_KEY: ${{ github.token }}
          ORG_GRADLE_PROJECT_unsignedControlBuild: 'true'
          CHECK_UPDATE: ${{ (github.ref == 'refs/heads/android/control-apk' && github.event_name == 'push') || inputs.check_update }}
        run: |
          set -euo pipefail
          mkdir -p unsigned
          # Run 1 used control.1. Each later run reserves two consecutive numbers.
          latest=$((2 * GITHUB_RUN_NUMBER - 1))
          versions=("$latest")
          if [[ "$CHECK_UPDATE" == true ]]; then
            versions=("$((latest - 1))" "$latest")
          fi
          for version in "${versions[@]}"; do
            flutter build apk --release --no-pub --split-per-abi --target-platform android-arm64 \
              --build-name "0.0.0-navqs.$version" --build-number "$version"
            apk="unsigned/TrustTunnel-NAVQS-arm64-$version.apk"
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$apk"
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging"
            # This Flutter version adds 2000 to the ARM64 versionCode for split APKs.
            grep -F "package: name='com.adguard.trusttunnel.control' versionCode='$((2000 + version))' versionName='0.0.0-navqs.$version'" "$RUNNER_TEMP/badging"
            grep -Fx "application-label:'TrustTunnel NAVQS'" "$RUNNER_TEMP/badging"
            grep -F "launchable-activity: name='com.adguard.trusttunnel.MainActivity'" "$RUNNER_TEMP/badging"
            unzip -Z1 "$apk" > "$RUNNER_TEMP/entries"
            grep -Fx 'lib/arm64-v8a/libtrusttunnel_android.so' "$RUNNER_TEMP/entries"
            if [[ "$GITHUB_REF_NAME" == android/app-vpn || "$GITHUB_REF_NAME" == fix/app-vpn-atomic-write ]]; then
              revision=$(cat android/app-vpn-sdk.rev)
              test "$(unzip -p "$apk" assets/navqs-app-vpn-sdk-revision)" = "$revision"
              unzip -p "$apk" 'classes*.dex' > "$RUNNER_TEMP/navqs.dex"
              grep -aqF 'Lcom/adguard/trusttunnel/AppVpnStore;' "$RUNNER_TEMP/navqs.dex"
              unzip -p "$apk" lib/arm64-v8a/libtrusttunnel_android.so > "$RUNNER_TEMP/navqs-engine.so"
              echo "4f5b50de041439b4dfb4064e4753d9299cf3c64b00ed82adf8da7b75c9ac962f  $RUNNER_TEMP/navqs-engine.so" | sha256sum -c -
              echo "Packaged App VPN adapter from $revision; ARM64 engine matches build 2017"
            fi
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: navqs-unsigned-intermediate
          path: unsigned/*.apk
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          overwrite: true

  sign:
    needs: build
    if: contains(fromJSON('["refs/heads/android/control-apk","refs/heads/android/dark-theme","refs/heads/android/quick-settings","refs/heads/android/app-vpn","refs/heads/fix/app-vpn-atomic-write"]'), github.ref)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ba202d63950529120273ce426486c6ddc91d8521
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: navqs-unsigned-intermediate
          path: unsigned
      - name: Install the pinned Android build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"'
      - name: Sign and check each APK with the permanent control certificate
        env:
          CONTROL_SIGNING_PEM: ${{ secrets.TRUSTTUNNEL_CONTROL_SIGNING_PEM }}
        run: bash .github/scripts/sign-android-control.sh unsigned navqs-output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: TrustTunnel-NAVQS-arm64
          path: navqs-output/
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  android-theme-emulator:
    if: (github.ref == 'refs/heads/android/dark-theme' || github.ref == 'refs/heads/android/quick-settings')
    needs: sign
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/android-theme-emulator.yml
    with:
      signed_run: ${{ format('{0}', github.run_id) }}
