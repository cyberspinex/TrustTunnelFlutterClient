name: Android control APK

on:
  push:
    branches: [android/control-apk]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Flutter 3.47.8 and Java 17
        run: |
          set -euo pipefail
          git clone --quiet --depth=1 --branch 3.47.8 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 737ba8f885dc774b53b442759999a312c9461e4e
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Prepare Android tools and generate sources
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
          flutter config --no-analytics
          flutter precache --android
          make init

      - name: Build with a temporary test key
        env:
          GPR_KEY: ${{ github.token }}
        run: |
          set -euo pipefail
          export CONTROL_STORE_PASSWORD="$(openssl rand -hex 32)"
          export ORG_GRADLE_PROJECT_signingConfigKeyStorePath="$RUNNER_TEMP/control.p12"
          export ORG_GRADLE_PROJECT_signingConfigKeyAlias=control
          export ORG_GRADLE_PROJECT_signingConfigKeyPassword="$CONTROL_STORE_PASSWORD"
          export ORG_GRADLE_PROJECT_signingConfigKeyStorePassword="$CONTROL_STORE_PASSWORD"
          keytool -genkeypair -alias control -keystore "$ORG_GRADLE_PROJECT_signingConfigKeyStorePath" -storetype PKCS12 \
            -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=TrustTunnel Control" \
            -storepass:env CONTROL_STORE_PASSWORD -keypass:env CONTROL_STORE_PASSWORD
          flutter build apk --release --no-pub --split-per-abi --target-platform android-arm64 \
            --build-name 0.0.0-control.1 --build-number 1

      - name: Verify signature, package, and native VPN library
        run: |
          set -euo pipefail
          mkdir -p control-output
          apk=control-output/TrustTunnel-Control-arm64.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$apk"
          sdk_tools="$ANDROID_HOME/build-tools/36.0.0"
          "$sdk_tools/apksigner" verify --verbose --print-certs "$apk"
          "$sdk_tools/zipalign" -c -P 16 4 "$apk"
          "$sdk_tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/control-badging.txt"
          grep -F "package: name='com.adguard.trusttunnel.control'" "$RUNNER_TEMP/control-badging.txt"
          grep -F "launchable-activity: name='com.adguard.trusttunnel.MainActivity'" "$RUNNER_TEMP/control-badging.txt"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/control-entries.txt"
          grep -Fx 'lib/arm64-v8a/libtrusttunnel_android.so' "$RUNNER_TEMP/control-entries.txt"
          (cd control-output && sha256sum TrustTunnel-Control-arm64.apk > SHA256SUMS)
          cat control-output/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: TrustTunnel-Control-arm64
          path: control-output/
          if-no-files-found: error
          compression-level: 0
